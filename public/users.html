<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="/index.css">
    <title>SALES.EDU.USERS</title>
</head>

<body>
    <div id="companyName">
        <h1>SALES.EDU - Users</h1>
        <h2>Where Dreams Come True</h2>
        <h4>Manage Users</h4>
    </div>

    <div>
        <fieldset>
            <legend>Menu</legend>
            <a href="/"><button type="button">Home</button></a>
            <a href="/services"><button type="button">Services</button></a>
            <a href="/sales"><button type="button">Sales</button></a>
            <button type="button">Users</button>
            <a href="/logs"><button type="button">Logs</button></a>
        </fieldset>
    </div>


    <div id="topButtons">
        <fieldset>
            <legend></legend>
            <button type="button" id="loadUsersBtn">Load Users</button>
            <button type="button">Refresh List</button>
        </fieldset>
    </div>

    <div id="usersFilters">
        <fieldset>
            <legend>Filters</legend>
            <label for="itemId">Item Id:</label>
            <input type="number" id="itemId" placeholder="Id">
            <label for="itemName">Item Name:</label>
            <input type="text" id="itemName" placeholder="Name">
            <label for="itemCategory">Item Category:</label>
            <input type="text" id="itemCategory" placeholder="Category">
            <label for="ItemPrice">Item Price:</label>
            <input type="number" id="itemPrice" placeholder="Price">
            <input type="text" placeholder="Elaijah">

        </fieldset>
    </div>

        <div id="listLoader">
        <fieldset>
            <legend>Sales Records</legend>
            <table border="1" width="100%" style="border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th>Select</th>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Employee Number</th>
                        <th>Possition</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Password</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- JavaScript will insert rows here! -->
                </tbody>
            </table>
        </fieldset>
    </div>

<script src="/users.js"></script>
</body>
</html>
